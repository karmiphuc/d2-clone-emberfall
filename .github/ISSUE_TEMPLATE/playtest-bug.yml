name: Playtest bug
description: Report an issue with the playable build.
title: "[Playtest] "
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include reproduction steps and what you expected.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on Windows, Safari on iPad, etc.
    validations:
      required: true
  - type: dropdown
    id: save
    attributes:
      label: Does it happen with a new save?
      options:
        - Not checked
        - Yes
        - No
