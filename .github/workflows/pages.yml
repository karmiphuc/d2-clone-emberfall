name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: node scripts/package-playtest.mjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: playtest-download
          path: artifacts/emberfall-playtest.html
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    name: Publish playtest
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    name: Publish versioned download
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playtest-download
          path: artifacts
      - name: Publish new package version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving its assets."
          else
            gh release create "$tag" artifacts/emberfall-playtest.html \
              --target "$GITHUB_SHA" --prerelease \
              --title "$tag — Emberfall playtest" --notes-file CHANGELOG.md
          fi
